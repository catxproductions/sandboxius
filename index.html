<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sandboxius</title>
  <style>
    :root {
      --bg: #e3e9f0;
      --fg: #16202b;
      --pn: #cfd8e3;
      --ac: #0f766e;
      --soft: rgba(255,255,255,.18);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1620;
        --fg: #dbe6f2;
        --pn: #1c2733;
        --ac: #2dd4bf;
        --soft: rgba(255,255,255,.04);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f1620;
      --fg: #dbe6f2;
      --pn: #1c2733;
      --ac: #2dd4bf;
      --soft: rgba(255,255,255,.04);
    }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 13px/1.35 ui-monospace, Menlo, Consolas, monospace;
      display: flex; justify-content: center; padding: 10px;
    }
    main {
      width: 100%; max-width: 960px; display: flex; flex-direction: column; gap: 8px;
    }
    h1 { margin: 0; font-size: 22px; }
    #bar, #row {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    }
    button, select {
      font: inherit; color: var(--fg); background: var(--pn); border: 1px solid var(--fg);
      padding: 5px 9px; cursor: pointer;
    }
    button.on {
      outline: 2px solid var(--ac); outline-offset: 1px;
    }
    canvas {
      width: 100%; aspect-ratio: 8 / 5; image-rendering: pixelated; touch-action: none;
      background: #0e101a; border: 2px solid var(--fg); cursor: crosshair;
    }
    input { accent-color: var(--ac); width: 90px; }
    #inf {
      min-height: 1.4em; color: color-mix(in srgb, var(--fg) 82%, var(--ac));
    }
    .tiny { opacity: .8; }
  </style>
</head>
<body>
  <main>
    <h1>Sandboxius</h1>
    <div id="bar"></div>
    <canvas id="cv" width="160" height="100"></canvas>
    <div id="row">
      <label>Wind <input id="wd" type="range" min="-10" max="10" value="0"></label>
      <label>Gravity X <input id="gx" type="range" min="-2" max="2" value="0" step="0.1"></label>
      <label>Gravity Y <input id="gy" type="range" min="-2" max="2" value="1" step="0.1"></label>
      <label>Brush <input id="br" type="range" min="0" max="8" value="3"></label>
      <select id="vw">
        <option>Normal</option>
        <option>Heat</option>
        <option>Pressure</option>
        <option>Stress</option>
        <option>Velocity</option>
      </select>
      <button id="pz">Pause</button>
      <button id="rs">Reset</button>
    </div>
    <div id="inf"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/gh/catxproductions/accntsystmhidden@main/auth.js"></script>
  <script>
    if (!accountSystem.isAuthenticated()) {
      window.location.href = "https://catxproductions.github.io/accntsystmhidden/login.html";
    }
  </script>

  <script>
    const W = 160, H = 100, N = W * H, DX = [1, -1, 0, 0], DY = [0, 0, 1, -1], rnd = Math.random, $ = i => document.getElementById(i);
    const M = [
      ['Air', [14, 16, 26], 0, 0, 0, 0, .12, 0, 0],
      ['Sand', [214, 184, 110], 1, 5, 0, 0, .15, 0, .12],
      ['Water', [54, 120, 220], 2, 3, 0, 0, .3, 0, .08],
      ['Stone', [122, 122, 130], 4, 9, 3, 320, .2, 1500, 0],
      ['Wood', [130, 86, 48], 4, 9, 1, 40, .06, 300, 0],
      ['Steel', [180, 180, 190], 4, 12, 4, 1200, .1, 2000, 0],
      ['Coal', [60, 60, 60], 4, 7, 2, 60, .15, 800, 0],
      ['Gunpowder', [80, 80, 100], 1, 5, 0, 0, .08, 0, .1],
      ['TNT', [180, 80, 80], 4, 9, 1, 40, .05, 150, 0],
      ['Fire', [220, 100, 0], 3, 0, 0, 0, .9, 0, 1],
      ['Steam', [200, 200, 220], 3, 0, 0, 0, .3, 0, .6],
      ['Smoke', [120, 120, 120], 3, 0, 0, 0, .3, 0, .7],
      ['Ash', [90, 90, 90], 1, 0, 0, 0, .2, 0, .15],
      ['Rubble', [100, 100, 100], 1, 3, 0, 0, .18, 0, .1],
      ['Dirt', [104, 74, 44], 1, 4, 0, 0, .2, 0, .1],
      ['Ice', [170, 220, 255], 4, 8, 0, 50, .06, 0, 0],
      ['Lava', [255, 90, 20], 2, 6, 0, 0, .4, 0, 0]
    ];
    const t = new Uint8Array(N), T = new Float32Array(N).fill(20), T2 = new Float32Array(N);
    const P = new Float32Array(N), P2 = new Float32Array(N), L = new Int16Array(N), mk = new Uint32Array(N);
    const WF = new Float32Array(N), WL = new Float32Array(N), SR = new Float32Array(N), ld = new Float32Array(N);
    const par = new Int32Array(N), q = new Int32Array(N);
    const VX = new Float32Array(N), VY = new Float32Array(N);
    const KE = new Float32Array(N);
    const SX = new Float32Array(N), SY = new Float32Array(N);
    const WA = new Float32Array(N);
    const DMG = new Float32Array(N), FS = new Uint8Array(N), dep = new Int16Array(N);
    let GX = 0, GY = 1, GM = 1, ADX = 0, ADY = 1;
    const inb = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
    const cv = $('cv'), ctx = cv.getContext('2d'), img = ctx.createImageData(W, H);
    const wd = $('wd'), gx = $('gx'), gy = $('gy'), br = $('br'), vw = $('vw'), bar = $('bar'), inf = $('inf');
    let fr = 0, paused = false, down = false, hx = -1, hy = -1;
    function mv(i, j) { const a = t[i]; t[i] = t[j]; t[j] = a; }
    function step() { /* original sandbox logic omitted here for brevity */ }
    function reset() { t.fill(0); }
    const tools = [1, 2, 3, 4, 5, 6, 7, 8, 9, 14, 15, 16].map(m => ({ n: M[m][0], m })).concat([{ n: 'Heat', m: 'h' }, { n: 'Chill', m: 'c' }, { n: 'Erase', m: 'e' }]);
    let tool = tools[0];
    tools.forEach((o, n) => {
      const b = document.createElement('button');
      b.textContent = o.n;
      if (!n) b.className = 'on';
      b.onclick = () => { tool = o; [...bar.children].forEach(x => x.classList.toggle('on', x === b)); };
      bar.append(b);
    });
    function loop() { requestAnimationFrame(loop); }
    reset();
    loop();
  </script>
</body>
</html>
