<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sandboxius</title>
  <style>
    :root {
      --bg: #e3e9f0;
      --fg: #16202b;
      --pn: #cfd8e3;
      --ac: #0f766e;
      --soft: rgba(255,255,255,.18);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1620;
        --fg: #dbe6f2;
        --pn: #1c2733;
        --ac: #2dd4bf;
        --soft: rgba(255,255,255,.04);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f1620;
      --fg: #dbe6f2;
      --pn: #1c2733;
      --ac: #2dd4bf;
      --soft: rgba(255,255,255,.04);
    }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 13px/1.35 ui-monospace, Menlo, Consolas, monospace;
      display: flex; justify-content: center; padding: 10px;
    }
    main {
      width: 100%; max-width: 960px; display: flex; flex-direction: column; gap: 8px;
    }
    h1 { margin: 0; font-size: 22px; }
    #bar, #row {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    }
    button, select {
      font: inherit; color: var(--fg); background: var(--pn); border: 1px solid var(--fg);
      padding: 5px 9px; cursor: pointer;
    }
    button.on {
      outline: 2px solid var(--ac); outline-offset: 1px;
    }
    canvas {
      width: 100%; aspect-ratio: 8 / 5; image-rendering: pixelated; touch-action: none;
      background: #0e101a; border: 2px solid var(--fg); cursor: crosshair;
    }
    input { accent-color: var(--ac); width: 90px; }
    #inf {
      min-height: 1.4em; color: color-mix(in srgb, var(--fg) 82%, var(--ac));
    }
    .tiny { opacity: .8; }
  </style>
</head>
<body>
  <main>
    <h1>Sandboxius</h1>
    <div id="bar"></div>
    <canvas id="cv" width="160" height="100"></canvas>
    <div id="row">
      <label>Wind <input id="wd" type="range" min="-10" max="10" value="0"></label>
      <label>Gravity X <input id="gx" type="range" min="-2" max="2" value="0" step="0.1"></label>
      <label>Gravity Y <input id="gy" type="range" min="-2" max="2" value="1" step="0.1"></label>
      <label>Brush <input id="br" type="range" min="0" max="8" value="3"></label>
      <select id="vw">
        <option>Normal</option>
        <option>Heat</option>
        <option>Pressure</option>
        <option>Stress</option>
        <option>Velocity</option>
      </select>
      <button id="pz">Pause</button>
      <button id="rs">Reset</button>
    </div>
    <div id="inf"></div>
  </main>

    <script>
    const W = 160, H = 100, N = W * H, DX = [1, -1, 0, 0], DY = [0, 0, 1, -1], rnd = Math.random, $ = i => document.getElementById(i);

    // Material database:
    // name, rgb, kind(0=air,1=powder,2=liquid,3=gas,4=solid), density, weight, strength, heat conduction, heat weakening, wind response
    const M = [
      ['Air', [14, 16, 26], 0, 0, 0, 0, .12, 0, 0],
      ['Sand', [214, 184, 110], 1, 5, 0, 0, .15, 0, .12],
      ['Water', [54, 120, 220], 2, 3, 0, 0, .3, 0, .08],
      ['Stone', [122, 122, 130], 4, 9, 3, 320, .2, 1500, 0],
      ['Wood', [130, 86, 48], 4, 9, 1, 40, .06, 300, 0],
      ['Steel', [180, 180, 190], 4, 12, 4, 1200, .1, 2000, 0],
      ['Coal', [60, 60, 60], 4, 7, 2, 60, .15, 800, 0],
      ['Gunpowder', [80, 80, 100], 1, 5, 0, 0, .08, 0, .1],
      ['TNT', [180, 80, 80], 4, 9, 1, 40, .05, 150, 0],
      ['Fire', [220, 100, 0], 3, 0, 0, 0, .9, 0, 1],
      ['Steam', [200, 200, 220], 3, 0, 0, 0, .3, 0, .6],
      ['Smoke', [120, 120, 120], 3, 0, 0, 0, .3, 0, .7],
      ['Ash', [90, 90, 90], 1, 0, 0, 0, .2, 0, .15],
      ['Rubble', [100, 100, 100], 1, 3, 0, 0, .18, 0, .1],
      ['Dirt', [104, 74, 44], 1, 4, 0, 0, .2, 0, .1],
      ['Ice', [170, 220, 255], 4, 8, 0, 50, .06, 0, 0],
      ['Lava', [255, 90, 20], 2, 6, 0, 0, .4, 0, 0]
    ];

    const t = new Uint8Array(N), T = new Float32Array(N).fill(20), T2 = new Float32Array(N);
    const P = new Float32Array(N), P2 = new Float32Array(N), L = new Int16Array(N), mk = new Uint32Array(N);
    
    // Core custom velocity, vector stress, kinetic energy, and fall trackers
    const VX = new Float32Array(N), VY = new Float32Array(N);
    const KE = new Float32Array(N); 
    const SX = new Float32Array(N), SY = new Float32Array(N); 
    const FS = new Uint8Array(N); // Counts continuous rows fallen without obstacle
    let GX = 0, GY = 1, GM = 1, ADX = 0, ADY = 1; 
    const inb = (x, y) => x >= 0 && y >= 0 && x < W && y < H;

    const cv = $('cv'), ctx = cv.getContext('2d'), img = ctx.createImageData(W, H);
    const wd = $('wd'), gx = $('gx'), gy = $('gy'), br = $('br'), vw = $('vw'), bar = $('bar'), inf = $('inf');

    let fr = 0, paused = false, down = false, hx = -1, hy = -1, curMat = 1;

    M.forEach((m, idx) => {
      if (idx === 0) return;
      const btn = document.createElement('button');
      btn.innerText = m[0];
      if (idx === 1) btn.classList.add('on');
      btn.onclick = () => {
        document.querySelectorAll('#bar button').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        curMat = idx;
      };
      bar.appendChild(btn);
    });

    function mv(i, j) {
      // Transfer velocity, stress vectors, kinetic energies, and continuous steps tracking
      let a = t[i]; t[i] = t[j]; t[j] = a;
      a = T[i]; T[i] = T[j]; T[j] = a;
      a = L[i]; L[i] = L[j]; L[j] = a;
      a = VX[i]; VX[i] = VX[j]; VX[j] = a;
      a = VY[i]; VY[i] = VY[j]; VY[j] = a;
      a = SX[i]; SX[i] = SX[j]; SX[j] = a;
      a = SY[i]; SY[i] = SY[j]; SY[j] = a;
      a = KE[i]; KE[i] = KE[j]; KE[j] = a;
      a = FS[i]; FS[i] = FS[j]; FS[j] = a;

      const dx = (j % W) - (i % W), dy = ((j / W) | 0) - ((i / W) | 0);
      VX[j] += (dx - VX[j]) * .6; VY[j] += (dy - VY[j]) * .6;
      if (t[i]) { VX[i] += (-dx - VX[i]) * .6; VY[i] += (-dy - VY[i]) * .6; } else { VX[i] = VY[i] = 0; }
      mk[i] = mk[j] = fr;
    }

    function ig(i, l) {
      t[i] = 9; L[i] = (l + rnd() * l) | 0; T[i] = 650; KE[i] = 0;
    }

    const sink = (a, b) => {
      const kb = M[b][2];
      return kb === 0 || kb === 3 || (kb === 2 && M[a][3] > M[b][3]);
    };

    function heat() {
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const i = y * W + x, m = t[i];
          const ka = M[m][6], Ti = T[i];
          let v = Ti;
          for (let d = 0; d < 4; d++) {
            const nx = x + DX[d], ny = y + DY[d];
            if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
            const j = ny * W + nx, kb = M[t[j]][6];
            v += (T[j] - Ti) * ka * kb / (ka + kb) * .5; 
          }
          const k = M[m][2];
          v += (20 - v) * (k === 0 || k === 3 ? .006 : .002);
          T2[i] = v;
        }
      }
      T.set(T2);
    }

    function pressure() {
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const i = y * W + x, k = M[t[i]][2];
          if (k === 4) { P2[i] = 0; continue; }
          let s = 0, c = 0;
          if (x > 0 && M[t[i - 1]][2] < 4) { s += P[i - 1]; c++; }
          if (x < W - 1 && M[t[i + 1]][2] < 4) { s += P[i + 1]; c++; }
          if (y > 0 && M[t[i - W]][2] < 4) { s += P[i - W]; c++; }
          if (y < H - 1 && M[t[i + W]][2] < 4) { s += P[i + W]; c++; }
          let p = P[i];
          if (c) p += (s / c - p) * .5;
          if (k === 0 || k === 3) p += Math.max(0, T[i] - 25) * .0006;
          P2[i] = p * (y ? .97 : .8);
        }
      }
      P.set(P2);
    }

    function applyGravity() {
      GX = parseFloat(gx.value);
      GY = parseFloat(gy.value);
      GM = Math.sqrt(GX * GX + GY * GY);
      if (GM > 0.01) {
        ADX = Math.round(GX / GM);
        ADY = Math.round(GY / GM);
      } else {
        ADX = 0; ADY = 1;
      }
    }

    // Impact Wave calculation function triggered on terminal hit
    function triggerImpactStress(impactX, impactY, energy) {
      if (energy < 1.5) return;
      let openList = [impactY * W + impactX];
      let closedSet = new Set(openList);
      let stressForce = energy * 18;

      while(openList.length > 0 && stressForce > 2) {
        let currIdx = openList.shift();
        let cx = currIdx % W, cy = (currIdx / W) | 0;
        
        for(let d = 0; d < 4; d++) {
          let nx = cx + DX[d], ny = cy + DY[d];
          if(!inb(nx, ny)) continue;
          let neighborIdx = ny * W + nx;
          
          if(!closedSet.has(neighborIdx)) {
            closedSet.add(neighborIdx);
            const m = t[neighborIdx];
            
            if(M[m][2] === 4) { // Hits Solid Wall Structure
              // Apply physical stress vector direction matching impact speed vector tracking
              SX[neighborIdx] += GX * energy;
              SY[neighborIdx] += GY * energy;
              
              let currentLoad = Math.sqrt(SX[neighborIdx]*SX[neighborIdx] + SY[neighborIdx]*SY[neighborIdx]);
              let structuralStrength = M[m][5];
              
              if(currentLoad > structuralStrength) {
                // Structural Failure! Turn structure into Rubble (13) or Ash (12)
                t[neighborIdx] = (m === 4) ? 12 : 13; 
                // Pass on leftover mechanical force/kinetic vector displacement values
                KE[neighborIdx] = energy * 0.5;
              } else {
                // Energy transfers smoothly through strong structures (like Steel)
                stressForce -= (structuralStrength * 0.05); 
                openList.push(neighborIdx);
              }
            } else if (M[m][2] === 1 || M[m][2] === 2) { 
              // Energy transfers directly into powders/liquids, scattering them
              VX[neighborIdx] += DX[d] * (energy * 0.3);
              VY[neighborIdx] += DY[d] * (energy * 0.3);
            }
          }
        }
        stressForce *= 0.85; // Dissipation over distance
      }
    }

    function step() {
      fr++;
      applyGravity();
      heat();
      pressure();

      // Clear dynamic directional stress channels over time so stress doesn't lock up
      for(let i=0; i<N; i++) {
        SX[i] *= 0.92;
        SY[i] *= 0.92;
      }

      let yStart = GY >= 0 ? H - 1 : 0;
      let yEnd = GY >= 0 ? -1 : H;
      let yStep = GY >= 0 ? -1 : 1;

      for (let y = yStart; y !== yEnd; y += yStep) {
        let xStart = GX >= 0 ? W - 1 : 0;
        let xEnd = GX >= 0 ? -1 : W;
        let xStep = GX >= 0 ? -1 : 1;

        for (let x = xStart; x !== xEnd; x += xStep) {
          const i = y * W + x;
          const m = t[i];
          if (m === 0 || mk[i] === fr) continue;

          const k = M[m][2];
          const density = M[m][3];
          const windResponse = M[m][8];
          const curWind = parseFloat(wd.value) * windResponse;

          // Process Active Falls & Kinetic Accumulation 
          if (k === 1 || k === 2) {
            let targetX = x + Math.round(curWind + ADX);
            let targetY = y + ADY;

            if (inb(targetX, targetY)) {
              let targetIdx = targetY * W + targetX;
              if (sink(m, t[targetIdx])) {
                FS[i]++; // Accumulate weight step metrics
                KE[i] += (density * 0.15) * GM; // Energy transfer gains momentum
                mv(i, targetIdx);
                continue;
              } else {
                // IMPACT ENCOUNTERED! 
                if (FS[i] > 1) {
                  triggerImpactStress(x, y, KE[i]);
                }
                FS[i] = 0;
                KE[i] = 0;
              }
            }

            // Vector Stress Pull: Cascading collapses shift particles in the direction of active strain
            let stressMagnitude = Math.sqrt(SX[i]*SX[i] + SY[i]*SY[i]);
            if (stressMagnitude > 2) {
              let pullX = x + Math.round(SX[i] / stressMagnitude);
              let pullY = y + Math.round(SY[i] / stressMagnitude);
              if (inb(pullX, pullY) && sink(m, t[pullY * W + pullX]) && rnd() < 0.7) {
                mv(i, pullY * W + pullX);
                continue;
              }
            }

            // Normal Diagonal Spreading 
            let diagX1 = targetX + (ADY !== 0 ? 1 : 0);
            let diagY1 = targetY + (ADX !== 0 ? 1 : 0);
            let diagX2 = targetX - (ADY !== 0 ? 1 : 0);
            let diagY2 = targetY - (ADX !== 0 ? 1 : 0);

            let spin = rnd() < 0.5;
            let firstX = spin ? diagX1 : diagX2, firstY = spin ? diagY1 : diagY2;
if (inb(firstX, firstY) && sink(m, t[firstY * W + firstX])) {
mv(i, firstY * W + firstX);
continue;
}
}
// Gas calculations
if (k === 3) {
let upX = x + Math.round(curWind - ADX);
let upY = y - ADY;
if (inb(upX, upY) && sink(m, t[upY * W + upX]) && rnd() < 0.4) {
mv(i, upY * W + upX);
}
}
}
}
// Reactions & Explosion updates
for (let i = 0; i < N; i++) {
const m = t[i];
if (m === 9 && L[i] <= 0) t[i] = rnd() < 0.15 ? 11 : 0;
if (m === 9 && L[i] > 0) L[i]--;
if (m === 8 && T[i] > 150) { // TNT Blast Detonation
ig(i, 45);
triggerImpactStress(i % W, (i / W) | 0, 15); // Large mechanical explosion impulse vector shockwave
}
}
}
function draw() {
const mode = vw.value;
let d = img.data;
for (let i = 0; i < N; i++) {
const m = t[i];
let r = 0, g = 0, b = 0;
if (mode === "Normal") {
let baseColor = M[m][1];
r = baseColor[0]; g = baseColor[1]; b = baseColor[2];
if (m === 9) {
r = 210 + Math.floor(rnd() * 45);
g = 60 + Math.floor(rnd() * 90);
b = 10;
}
} else if (mode === "Heat") {
let norm = Math.min(1, T[i] / 800);
r = Math.floor(norm * 255);
g = Math.floor(Math.max(0, norm - 0.5) * 2 * 255);
b = Math.floor(Math.max(0, norm - 0.8) * 5 * 255);
} else if (mode === "Pressure") {
r = Math.floor(Math.min(255, P[i] * 1200));
g = 20; b = 80;
} else if (mode === "Stress") {
// Renders dynamic mechanical vector load intensity pathways across pixels
let currentLoad = Math.sqrt(SX[i]*SX[i] + SY[i]*SY[i]);
r = Math.floor(Math.min(255, currentLoad * 12));
g = m ? 45 : 12;
b = m ? 120 : 35;
} else if (mode === "Velocity") {
let energyIntensity = Math.min(255, KE[i] * 40);
r = Math.floor(energyIntensity);
g = m ? 70 : 15;
b = 110;
}
let idx = i * 4;
d[idx] = r; d[idx+1] = g; d[idx+2] = b; d[idx+3] = 255;
}
ctx.putImageData(img, 0, 0);
}
function loop() {
if (!paused) step();
draw();
requestAnimationFrame(loop);
}
function addElements(e) {
const rect = cv.getBoundingClientRect();
const scaleX = W / rect.width;
const scaleY = H / rect.height;
const mx = Math.floor((e.clientX - rect.left) * scaleX);
const my = Math.floor((e.clientY - rect.top) * scaleY);
const radius = parseInt(br.value);
for (let dy = -radius; dy <= radius; dy++) {
for (let dx = -radius; dx <= radius; dx++) {
if (dxdx + dydy <= radius*radius) {
let nx = mx + dx, ny = my + dy;
if (inb(nx, ny)) {
let idx = ny * W + nx;
if (curMat === 9) { ig(idx, 20); } else { t[idx] = curMat; T[idx] = 20; FS[idx] = 0; KE[idx] = 0; SX[idx] = 0; SY[idx] = 0; }
}
}
}
}
}
cv.addEventListener('mousedown', (e) => { down = true; addElements(e); });
window.addEventListener('mouseup', () => down = false);
cv.addEventListener('mousemove', (e) => { if (down) addElements(e); });
$('pz').onclick = () => { paused = !paused; $('pz').innerText = paused ? "Resume" : "Pause"; };
$('rs').onclick = () => { t.fill(0); T.fill(20); P.fill(0); VX.fill(0); VY.fill(0); KE.fill(0); SX.fill(0); SY.fill(0); FS.fill(0); };
loop();
</script>
</body>
</html>
